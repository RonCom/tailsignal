tailsignal:
  target: local
  outputs:
    local:
      type: duckdb
      path: data/warehouse.duckdb
      threads: 4
    # Snowflake target (fill in, then: dbt build --target snowflake). Raw files are
    # loaded to a stage first; see docs/snowflake.md (Phase 2).
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: TAILSIGNAL
      schema: PUBLIC
      threads: 4
