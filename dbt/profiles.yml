tailsignal:
  target: local
  outputs:
    local:
      type: duckdb
      path: data/warehouse.duckdb
      threads: 4
    # Snowflake target: key-pair auth, no secrets in the repo.
    # `python -m tailsignal.snowflake build` sets these from config/snowflake.yaml (+ .local.yaml).
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'FWA_SVC') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TAILSIGNAL_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'FWA_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'TAILSIGNAL') }}"
      schema: PUBLIC
      authenticator: snowflake_jwt
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      threads: 4
