name: tailsignal
version: "0.1.0"
config-version: 2
profile: tailsignal

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  raw_dir: "data/raw/synthetic"
  k_anonymity: 10          # minimum cell size for released products
  holdout_start: "2024-07-01"

models:
  tailsignal:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: core
      product:
        +materialized: table
        +schema: product

seeds:
  tailsignal:
    +schema: reference
