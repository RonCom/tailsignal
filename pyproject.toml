[project]
name = "tailsignal"
version = "0.1.0"
description = "Multi-channel pet health data platform: collect, organize, analyze, and commercialize pet care data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "splink>=5,<6",
    "dbt-duckdb>=1.9",
    "requests>=2.32",
    "pyyaml>=6",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsforecast>=2.0",
    "hierarchicalforecast>=1.2",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
